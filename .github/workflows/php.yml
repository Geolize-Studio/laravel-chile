name: PHP checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        dependencies: [lowest, highest]
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    env:
      COMPOSER_ROOT_VERSION: dev-main
      LARAVEL_MAJOR: ${{ matrix.laravel }}
      DEPENDENCIES: ${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Validate package metadata
        run: composer validate --strict
      - name: Select framework and test harness
        run: |
          if [ "$LARAVEL_MAJOR" = '12' ]; then
            FRAMEWORK_CONSTRAINT='^12.24'
            TESTBENCH_CONSTRAINT='^10.5'
          else
            FRAMEWORK_CONSTRAINT='^13.0'
            TESTBENCH_CONSTRAINT='^11.0'
          fi
          composer require --dev "laravel/framework:$FRAMEWORK_CONSTRAINT" "orchestra/testbench:$TESTBENCH_CONSTRAINT" --no-update --no-interaction
      - name: Resolve supported dependencies
        run: |
          if [ "$DEPENDENCIES" = 'lowest' ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction
          else
            composer update --prefer-stable --prefer-dist --no-interaction
          fi
      - run: composer test
      - run: php examples/quickstart.php
      - run: composer analyse
        if: matrix.dependencies == 'highest'
      - run: composer lint
        if: matrix.dependencies == 'highest'
      - run: composer audit
        if: matrix.dependencies == 'highest'

  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
    name: Consumer PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    env:
      COMPOSER_ROOT_VERSION: dev-main
      LARAVEL_MAJOR: ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: python3 scripts/test_consumer.py --laravel "$LARAVEL_MAJOR" --with-boost
